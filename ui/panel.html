              <button class="batch-btn" id="batchExport" hidden>导出</button>
              <button class="batch-btn" id="batchOrganize" hidden><svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="width:13px;height:13px;vertical-align:-2px"><path d="M11 2.8l1.9 5 5 1.9-5 1.9-1.9 5-1.9-5-5-1.9 5-1.9 1.9-5z"/><path d="M17.5 15.5l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8.8-2z"/></svg> 整理</button>
              <button class="batch-btn" id="batchMerge" hidden><svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="width:13px;height:13px;vertical-align:-2px"><path d="M11 2.8l1.9 5 5 1.9-5 1.9-1.9 5-1.9-5-5-1.9 5-1.9 1.9-5z"/></svg> 合并整理</button>
              <button class="batch-btn" id="batchRestore" hidden>恢复选中</button>
              <button class="batch-btn danger" id="batchDelete">删除选中</button>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <div id="datepop" class="pop"></div>
  <div id="morepop" class="pop"></div>
  <div id="filterpop" class="pop"></div>
  <div class="drawer-overlay" id="detailOverlay"></div>
  <div class="detail-modal" id="detailModal">
    <div class="detail-head">
      <span class="detail-title" id="detailTitle">笔记详情</span>
      <button class="drawer-close" id="detailClose">×</button>
    </div>
    <div class="detail-body" id="detailBody"></div>
  </div>
  <div id="helpPop" class="pop" style="width:300px">
    <div class="phead"><span class="ptitle">快捷键</span><span style="flex:1"></span><button class="tool-btn" id="helpclose">✕</button></div>
    <div class="drow" style="cursor:default"><span>说话录音 / 停止</span><span style="margin-left:auto"><kbd>F10</kbd></span></div>
    <div class="drow" style="cursor:default"><span>聚焦搜索</span><span style="margin-left:auto"><kbd>/</kbd></span></div>
    <div class="drow" style="cursor:default"><span>快速跳转面板</span><span style="margin-left:auto"><kbd>Ctrl</kbd>+<kbd>K</kbd></span></div>
    <div class="drow" style="cursor:default"><span>切换模块</span><span style="margin-left:auto"><kbd>←</kbd> <kbd>→</kbd></span></div>
    <div class="drow" style="cursor:default"><span>逐层退出</span><span style="margin-left:auto"><kbd>Esc</kbd></span></div>
    <div class="drow" style="cursor:default"><span>存日记</span><span style="margin-left:auto"><kbd>Ctrl</kbd>+<kbd>Enter</kbd> / <kbd>Ctrl</kbd>+<kbd>S</kbd></span></div>
    <div class="drow" style="cursor:default"><span>全选当前列表</span><span style="margin-left:auto"><kbd>Ctrl</kbd>+<kbd>A</kbd></span></div>
    <div class="drow" style="cursor:default"><span>详情里上/下一条</span><span style="margin-left:auto"><kbd>←</kbd> <kbd>→</kbd></span></div>
    <div class="drow" style="cursor:default"><span>快捷键帮助</span><span style="margin-left:auto"><kbd>?</kbd></span></div>
    <div class="drow" style="cursor:default"><span>速记悬浮窗</span><span style="margin-left:auto">天禧键</span></div>
  </div>
  <div id="cmdk" class="pop" style="width:min(480px,92vw)">
    <input id="cmdin" placeholder="跳到模块、搜笔记、执行操作…" autocomplete="off">
    <div id="cmdres"></div>
  </div>
  <div id="modalWrap"><div class="modal-card" id="modalCard"></div></div>
  <div id="confirmStack"></div>
  <div id="digestpop" class="pop">
    <div class="phead"><span class="ptitle">回顾</span>
      <button class="tool-btn dtab on" data-scope="day">今日</button>
      <button class="tool-btn dtab" data-scope="week">本周</button>
      <span class="spacer" style="flex:1"></span>
      <button class="tool-btn" id="dclose">✕</button></div>
    <div class="dbody">…</div>
    <div class="dnote">只展示不保存，不会生成新笔记。</div>
  </div>
  <div id="ctdetail" class="pop"></div>
  <div id="emojipopup"></div>
  <div class="toast-container" id="toastBox"></div>

  <div class="drawer-overlay" id="aiOverlay"></div>
  <div class="drawer" id="aiDrawer">
    <div class="drawer-header">
      <span class="drawer-title"><svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><rect x="4" y="7" width="14" height="10" rx="3"/><circle cx="9" cy="12" r="1.2" fill="currentColor" stroke="none"/><circle cx="13" cy="12" r="1.2" fill="currentColor" stroke="none"/><path d="M11 7V4.5M8 4.5h6"/></svg>识别记录</span>
      <button class="drawer-close" data-close="ai">×</button>
    </div>
    <div class="drawer-body" id="aiDrawerBody"></div>
  </div>
  <div class="drawer-overlay" id="setOverlay"></div>
  <div class="drawer" id="setDrawer">
    <div class="drawer-header">
      <span class="drawer-title"><svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="11" cy="11" r="2.6"/><path d="M11 3.2v2.2M11 16.6v2.2M18.8 11h-2.2M5.4 11H3.2M16.8 5.2l-1.6 1.6M6.8 15.2l-1.6 1.6M16.8 16.8l-1.6-1.6M6.8 6.8L5.2 5.2"/></svg>设置</span>
      <button class="drawer-close" data-close="set">×</button>
    </div>
    <div class="drawer-body" id="setDrawerBody"></div>
  </div>

  <script src="/app.js?v=66"></script>
  <script src="/ui/modules.js?v=65"></script>
</body>
</html>
